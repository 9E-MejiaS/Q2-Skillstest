<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | OB Montessori</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Shared stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>

<body class="contact-page">

  <!-- NAVIGATION -->
  <nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container-fluid">

      <a class="navbar-brand" href="index.html">
        <img
          src="OBMC LOGO.png"
          alt="OB Montessori Logo"
          class="school-logo"
        >
      </a>

      <div class="navbar-collapse">
        <ul class="navbar-nav me-auto">

          <li class="nav-item">
            <a class="nav-link" href="index.html">
              Home
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="about%20us.html">
              About Us
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="enroll.html">
              Enroll
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#contact">
              Contact Us
            </a>
          </li>

        </ul>

        <a class="btn btn-primary" href="#contact">
          Get Started
        </a>
      </div>

    </div>
  </nav>

  <!-- CONTACT SECTION -->
  <main class="contact-section" id="contact">
    <div class="contact-container">

      <header class="contact-heading">
        <h1>Enroll</h1>
        <p>
          We'd love to accomodate your child.
        </p>
      </header>

      <div class="contact-layout">

        <!-- MESSAGE FORM -->
        <section class="message-card">
          <div class="message-body">

            <h2 class="section-title">Student Information</h2>

            <form id="contactForm">

              <div class="name-fields">
                <div class="field">
                  <label for="firstName" class="visually-hidden">
                    First Name
                  </label>

                  <input
                    type="text"
                    class="form-control"
                    id="firstName"
                    name="firstName"
                    placeholder="First Name *"
                    autocomplete="given-name"
                    required
                  >
                </div>

                <div class="field">
                  <label for="lastName" class="visually-hidden">
                    Last Name
                  </label>

                  <input
                    type="text"
                    class="form-control"
                    id="lastName"
                    name="lastName"
                    placeholder="Last Name *"
                    autocomplete="family-name"
                    required
                  >
                </div>
              </div>

              <div class="form-field">
                <label for="email" class="visually-hidden">
                  Email Address
                </label>

                <input
                  type="email"
                  class="form-control"
                  id="email"
                  name="email"
                  placeholder="Email Address *"
                  autocomplete="email"
                  required
                >
              </div>

              <div class="form-field">
                <label for="subject" class="visually-hidden">
                  Subject
                </label>

                <select
                  class="form-select"
                  id="subject"
                  name="subject"
                  required
                >
                  <option value="" selected disabled>
                    Mode of Enrollment
                  </option>

                  <option value="admissions">
                    Online
                  </option>

                  <option value="enrollment">
                    In-Person
                  </option>


                </select>

                 <select
                  class="form-select"
                  id="subject"
                  name="subject"
                  required
                >
                  <option value="" selected disabled>
                    Campus
                  </option>

                  <option value="admissions">
                    Greenhills
                  </option>

                  <option value="enrollment">
                    Fairview
                  </option>

                  <option value="enrollment">
                    Angeles
                  </option>
                  <option value="enrollment">
                    Las Pinas
                  </option>


                </select>


              </div>

              <div class="form-field">
                <label for="message" class="visually-hidden">
                  Your Message
                </label>

                <textarea
                  class="form-control"
                  id="message"
                  name="message"
                  rows="3"
                  placeholder="Your message here..."
                  required
                ></textarea>
              </div>

              <button
                type="submit"
                class="btn btn-primary send-button"
              >
                Send Message
              </button>

            </form>

          </div>
        </section>



      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer bg-dark">
    <small>
      &copy; 2026 OB Montessori Center. All rights reserved.
    </small>
  </footer>

  <script>
    document.getElementById("contactForm").addEventListener(
      "submit",
      function (event) {
        event.preventDefault();
      }
    );
  </script>

</body>
</html>
